# Local development: the API built from this checkout, plus its own vector store.
#
#   cp .env.example .env      # set JWT_SECRET; GOOGLE_API_KEY is optional
#   docker compose up -d --build
#   docker compose exec api python scripts/seed_sandbox.py
#
# The API serves both /api and the built React SPA, so http://localhost:8000 is
# the whole product. See README.md.

services:
  api:
    build: .
    container_name: coair-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=8000
      # The vector store below, not a hosted one. Overridable in .env, but note
      # that the embedding model which created a collection must also embed its
      # queries — switching backends means rebuilding the collection.
      - VECTOR_STORE_BACKEND=qdrant
      - QDRANT_URL=http://qdrant:6333
      - FORENSIC_NATIVE_UI_V1=true
    ports:
      - "8000:8000"
    volumes:
      # Accounts, projects, conversations, job queues.
      - ./storage:/app/storage
      # Uploaded files, per project.
      - ./data:/app/data
    depends_on:
      - qdrant
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  qdrant:
    image: qdrant/qdrant:v1.15.4
    container_name: coair-qdrant
    restart: unless-stopped
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-local-dev-key}
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage
      - ./qdrant_snapshots:/qdrant/snapshots
