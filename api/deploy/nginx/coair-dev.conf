# COAir DEVELOPMENT stack — a separate origin on the same host, port 8090.
#
# Production stays exactly where it is: the `default_server` block on port 80
# proxying to 127.0.0.1:8000. This file adds a second server block in front of
# the dev API on 127.0.0.1:8100 and touches nothing else.
#
# A URL subpath (/dev/) is deliberately NOT used: the React SPA is served from
# the root by FastAPI and has no Vite `base`, so every asset and deep link would
# break. A second port is the only clean separation without a domain.
#
# There is no TLS on this box. The basic-auth password and any dev session
# cookie travel in cleartext — use a throwaway password here and never reuse a
# production one. The IP allow-list below is the stronger control; uncomment it
# once you know the address you connect from.
#
# Installed by deploy/install_dev_nginx.sh as
# /etc/nginx/sites-available/coair-dev. The deploy pipeline never touches nginx.
server {
    listen 8090;
    listen [::]:8090;
    server_name _;

    # Keep an unfinished build out of search results and off casual scanners.
    add_header X-Robots-Tag "noindex, nofollow" always;
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # allow 203.0.113.4;   # your office/home IP — add lines, then uncomment
    # deny all;            # ...and this one. Order matters: allow before deny.

    auth_basic           "COAir dev";
    auth_basic_user_file /etc/nginx/.htpasswd-coair-dev;

    # Mirrors the production block's upload ceiling.
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        # Ingestion and chronology runs hold the connection open for minutes.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # The Delay Analysis Toolkit is production-only (the dev deploy never starts
    # that container). If you ever enable it, add the /toolkit/ location here
    # pointing at 127.0.0.1:8601 — do NOT run install_toolkit_nginx.sh, which
    # edits the block that proxies :8000, i.e. production's.
}
