# Isolated candidate on an existing DGX. Reuses inference; never mounts live data.
name: coair-secure
x-harden: &harden
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
services:
  secure-db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: coair
      POSTGRES_DB: coair
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Private runtime env required}
    volumes: [postgres:/var/lib/postgresql/data]
    networks: [data]
    healthcheck:
      test: [CMD, pg_isready, -U, coair, -d, coair]
      interval: 5s
      retries: 20
  secure-qdrant:
    image: qdrant/qdrant:v1.15.4
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Private runtime env required}
      QDRANT__TELEMETRY_DISABLED: 'true'
    volumes: [qdrant:/qdrant/storage]
    networks: [data]
  secure-model-proxy:
    <<: *harden
    image: nginx:1.28-alpine
    environment:
      MODEL_UPSTREAM: http://100.91.121.116:8000
    volumes:
      - ./model-proxy.conf.template:/etc/nginx/templates/default.conf.template:ro
    tmpfs: [/tmp, /var/cache/nginx, /var/run, /etc/nginx/conf.d]
    networks: [data, model]
  secure-api:
    <<: *harden
    image: ${SECURE_API_IMAGE:?Verified protected image required}
    env_file: secure.env
    environment:
      DEPLOYMENT_MODE: local
      AUTH_PROVIDER: local
      DATABASE_URL: postgresql://coair:${POSTGRES_PASSWORD}@secure-db:5432/coair
      VECTOR_STORE_BACKEND: qdrant
      QDRANT_URL: http://secure-qdrant:6333
      LLM_PRIMARY_PROVIDER: vllm
      LLM_BASE_URL: http://secure-model-proxy:8081/v1
      EMBEDDING_PROVIDER: api
      EMBEDDING_API_URL: http://embedding:8082/v1/embeddings
      CHRONOLOGY_PIPELINE_VERSION: v2
      OCR_VISION_FALLBACK_ENABLED: 'false'
      AWS_EC2_METADATA_DISABLED: 'true'
      HF_HUB_OFFLINE: '1'
      GOOGLE_API_KEY: ''
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      ZAI_API_KEY: ''
      SUPABASE_URL: ''
      SUPABASE_DB_URL: ''
      S3_BUCKET_NAME: ''
      GCS_BUCKET_NAME: ''
      PYTHONDONTWRITEBYTECODE: '1'
      COAIR_ENV: production
      COAIR_DEBUG_MFA: '0'
    volumes:
      - documents:/app/data
      - storage:/app/storage
      - cache:/app/cache
      - ocr-cache:/app/.cache
      - logs:/app/logs
      - temporary:/tmp
      - ./secrets/device.key:/run/secrets/coair-protection.key:ro
      - ./secrets/license.json:/run/secrets/coair-license.json:ro
      - /etc/machine-id:/run/coair-machine-id:ro
    networks: [data, inference]
    depends_on:
      secure-db: {condition: service_healthy}
      secure-qdrant: {condition: service_started}
    healthcheck:
      test: [CMD, curl, -fsS, 'http://localhost:8080/api/health']
      interval: 15s
      start_period: 90s
      timeout: 5s
      retries: 10
  secure-web:
    <<: *harden
    image: coair-secure-web:current
    environment:
      COAIR_API_ORIGIN: http://secure-api:8080
      NEXT_TELEMETRY_DISABLED: '1'
    tmpfs: [/tmp, /app/.next/cache]
    networks: [data]
    depends_on:
      secure-api: {condition: service_healthy}
  secure-gateway:
    <<: *harden
    image: nginx:1.28-alpine
    ports: ['100.91.121.116:18082:80']
    volumes: ['./nginx.secure.conf:/etc/nginx/conf.d/default.conf:ro']
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    networks: [data, edge]
    depends_on: [secure-web]
networks:
  data: {internal: true}
  inference:
    external: true
    name: coair-local_service
  model: {}
  edge: {}
volumes:
  postgres: {}
  qdrant: {}
  documents: {}
  storage: {}
  cache: {}
  logs: {}
  temporary: {}
  ocr-cache: {}
