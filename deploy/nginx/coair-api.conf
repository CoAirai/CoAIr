# COAir API — nginx site for api.coair.ai
# Install: sudo cp deploy/nginx/coair-api.conf /etc/nginx/sites-available/coair-api
#          sudo ln -sf /etc/nginx/sites-available/coair-api /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#          sudo certbot --nginx -d api.coair.ai

server {
    listen 80;
    server_name api.coair.ai;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }
}
