# COAir Next.js — nginx for login / admin / user subdomains
# All three hostnames proxy to the same Next.js process (port 3000).
# Middleware routes by Host header.
#
# Install:
#   sudo cp deploy/nginx/coair-app.conf /etc/nginx/sites-available/coair-app
#   sudo ln -sf /etc/nginx/sites-available/coair-app /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d login.coair.ai -d admin.coair.ai -d user.coair.ai

upstream coair_nextjs {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    server_name login.coair.ai admin.coair.ai user.coair.ai;

    location / {
        proxy_pass http://coair_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        client_max_body_size 50M;
    }
}
