map $http_upgrade $coair_connection {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name __HOSTNAME__;
    return 308 https://__HOSTNAME__$request_uri;
}
server {
    listen 443 ssl;
    server_name __HOSTNAME__;
    ssl_certificate /etc/letsencrypt/live/__HOSTNAME__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__HOSTNAME__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_buffering off;
    proxy_request_buffering off;
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
    location /toolkit/ {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $coair_connection;
        proxy_pass http://127.0.0.1:8501;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
