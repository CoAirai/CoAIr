# Render the token from the server's protected staging credentials, never Git.
map $cookie_coair_integration_gate $coair_integration_access {
    default 0;
    "__INTEGRATION_GATE_TOKEN__" 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name coair-test.duckdns.org;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / { return 308 https://coair-test.duckdns.org$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name coair-test.duckdns.org;
    ssl_certificate /etc/letsencrypt/live/coair-test.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coair-test.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 100m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    auth_basic "Coair integration";
    auth_basic_user_file /etc/nginx/.htpasswd-coair-integration;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_buffering off;

    location = /robots.txt {
        auth_basic off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
    location /coair-api/ {
        # Keep Authorization free for the application's Bearer token. The gate
        # is issued only after a successful password-protected page response.
        auth_basic off;
        if ($coair_integration_access = 0) { return 403; }
        proxy_pass http://127.0.0.1:3200;
    }
    location / {
        add_header Set-Cookie "coair_integration_gate=__INTEGRATION_GATE_TOKEN__; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=604800";
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://127.0.0.1:3200;
    }
}
